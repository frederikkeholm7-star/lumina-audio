<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMINA Audio</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/lumina logo sort.png">
</head>


<body>
    <header>
        <nav>

            <a href="index.html" class="brand">
            <img src="img/lumina logo sort.png" alt="LUMINA Audio logo">
            <span>LUMINA Audio</span>
            </a>

            <ul>
                <li><a href="#social-connect">Social Connect</a></li>
                <li><a href="#lifestyle-carousel">Experience</a></li>
                <li><a href="#product-details">Details</a></li>
            </ul>
        </nav>
    </header>

<main>

    <section class="hero">
<div class="hero-text">
    <h1>Bring Light to Your Sound.</h1>

    <p>Powerful sound, ambient light and effortless connection — designed to bring people together, wherever the moment takes you.</p>

    <button class="hero-button">Order now</button>
</div>

<div 
    class="hero-product-area">
     <img src="img/råhvid Background Removed.png" alt="LUMINA Audio speaker">
</div>

    </section>


    <section class="retailers">

        <div class="retailer-logos">
            <img src="img/Magasin logo.webp" alt="Magasin">
            <img src="img/power logo.jpg" alt="POWER">
            <img src="img/Elgiganten logo.png" alt="Elgiganten">
            <img src="img/coolshop logo.png" alt="Coolshop">
            <img src="img/HiFi Logo.png" alt="HiFi Klubben">
        </div>

    </section>

    <section id="lifestyle-carousel" class="lifestyle-carousel">

        <div class="carousel-cards">

            <div class="carousel-card-1">
                <img src="img/Strand billede.png" alt="Friends enjoying music outdoors">
                <p>Take your sound anywhere.</p>
            </div>

            <div class="carousel-card-2">
                <img src="img/Picnic i park.png" alt="Friends enjoying music together at a picnic">
                <p>Made for moments together.</p>
            </div>

            <div class="carousel-card-3">
                <img src="img/Home estetik.png" alt="Friends listening to music at home">
                <p>Sound that sets the mood.</p>
            </div>

        </div>

        <button class="carousel-arrow carousel-arrow-left" aria-label="Previous slide">
        </button>

        <button class="carousel-arrow carousel-arrow-right" aria-label="Next slide">
        </button>

        <div class="carousel-dots">
            <span class="carousel-dot"></span>
            <span class="carousel-dot active"></span>
            <span class="carousel-dot"></span>
            <span class="carousel-dot"></span>
        </div>




    </section>

    <section id="social-connect" class="social-connect">

    </section>

    <section id="product-details" class="product-details">

    </section>

    <section class="reviews">

    </section>

    <section class="review-cards">

    </section>


</main>

    <footer>

    </footer>

    
</body>

</html>
